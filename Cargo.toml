[workspace]
resolver = "2"
members = ["exercises/*/ex*", "solutions/*/ex*", "test-kit"]

[workspace.dependencies]
anchor-lang = "=0.30.1"
solana-program = "=1.18.26"
solana-program-test = "=1.18.26"
solana-sdk = "=1.18.26"
tokio = { version = "1", features = ["macros", "rt"] }
anchorlings_test_kit = { path = "test-kit" }

# anchor-lang's macros emit `#[cfg(feature = "...")]` and `#[cfg(target_os = "solana")]`
# for flags that only exist downstream (real on-chain builds, anchor CLI feature gates).
# Teach the compiler these are known so it doesn't bury real errors under cfg warnings.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("no-entrypoint", "no-idl", "no-log-ix-name", "cpi", "custom-heap", "custom-panic", "anchor-debug"))',
    'cfg(target_os, values("solana"))',
] }

[package]
name = "anchorlings"
version = "0.1.0"
edition = "2021"
authors = ["NZT48"]
description = "A Rustlings-inspired onboarding journey to Solana via the Anchor framework."
license = "Apache-2.0"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
