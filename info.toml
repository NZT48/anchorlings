format_version  = 1
welcome_message = "Welcome to anchorlings — Anchor in 45 exercises."
final_message   = "You've completed v1. Next: install `avm` and ship something real."

[[exercises]]
name    = "ex01_declare_id"
chapter = "01_skeleton"
mode    = "check"
hint    = """
`declare_id!` takes a base58-encoded program ID as a string literal. Any \
valid base58 32-byte pubkey works for learning; e.g. the System Program ID \
`11111111111111111111111111111112`. \
See https://book.anchor-lang.com/anchor_in_depth/the_program_module.html
"""

[[exercises]]
name    = "ex02_program_module"
chapter = "01_skeleton"
mode    = "check"
hint    = """
`#[program]` is a module-level attribute. It walks the items inside a `mod` \
to build the dispatcher, so it can't be applied to a free function. Wrap \
the handler in `pub mod ex02_program_module { use super::*; ... }` and put \
the `#[program]` attribute on the module.
"""

[[exercises]]
name    = "ex03_entry_handler"
chapter = "01_skeleton"
mode    = "check"
hint    = """
The dispatcher generated by `#[program]` calls each handler and propagates \
its error with `?`. That only works if the handler returns `Result<()>`. \
Add the return type to the signature and end the body with `Ok(())`.
"""

[[exercises]]
name    = "ex04_handler_arg"
chapter = "02_handlers"
mode    = "check"
hint    = """
Anchor handler signatures look like \
`fn name(ctx: Context<T>, arg1: A, arg2: B, ...) -> Result<R>`. The arguments \
after `Context<T>` become part of the instruction data the caller sends. \
Add `count: u64` as the second parameter.
"""

[[exercises]]
name    = "ex05_handler_multi_args"
chapter = "02_handlers"
mode    = "check"
hint    = """
You can take as many arguments as you like after `Context<T>`, as long as each \
type is borsh-serialisable. Add `name: String` and `amount: u64` in that order.
"""

[[exercises]]
name    = "ex06_handler_return_value"
chapter = "02_handlers"
mode    = "check"
hint    = """
A handler can return any `Result<T>` where `T` is borsh-serialisable. Anchor \
encodes the success value into the transaction's return data. The signature \
is already `Result<u64>` — fix the body to return `Ok(42)`.
"""

[[exercises]]
name    = "ex07_handler_struct_arg"
chapter = "02_handlers"
mode    = "check"
hint    = """
Custom structs passed as handler args must implement `AnchorSerialize` and \
`AnchorDeserialize` so anchor can decode them from instruction data. The \
easiest way is the derive form:

    #[derive(AnchorSerialize, AnchorDeserialize, Clone)]
    pub struct Config { ... }

Anchor's `prelude` re-exports both derive macros.
"""

[[exercises]]
name    = "ex08_accounts_derive"
chapter = "03_accounts_structs"
mode    = "check"
hint    = """
The compiler error mentions a missing `Bumps` trait — that's one of the \
traits `#[derive(Accounts)]` generates. Any struct used as the `T` in \
`Context<T>` needs `#[derive(Accounts)]` above it.
"""

[[exercises]]
name    = "ex09_accounts_lifetime"
chapter = "03_accounts_structs"
mode    = "check"
hint    = """
The `AccountInfo<'info>` field references a lifetime named `'info`, but the \
struct itself never introduced it. Add the parameter to the struct:

    pub struct Greet<'info> { ... }

Anchor's convention is to always name this lifetime `'info`.
"""

[[exercises]]
name    = "ex10_account_info_field"
chapter = "03_accounts_structs"
mode    = "check"
hint    = """
The handler reads `ctx.accounts.recipient`, but the `Greet` struct doesn't \
declare a `recipient` field. Every account a handler reads or writes must \
be a field on the Accounts struct so anchor includes it in the dispatcher.
"""

[[exercises]]
name    = "ex11_distinct_accounts"
chapter = "03_accounts_structs"
mode    = "check"
hint    = """
The error 'could not find `__client_accounts_pong`' is anchor's macro \
complaining that it can't find the metadata `#[derive(Accounts)]` would \
have generated for `Pong`. Each handler picks its own `Context<T>` type, \
so you need to define a separate `Pong` Accounts struct alongside `Ping`.
"""

[[exercises]]
name    = "ex12_mut_constraint"
chapter = "04_constraints"
mode    = "test"
hint    = """
The test calls `set_value(42)`, then reads the counter back and expects to \
see `42`. The handler runs but the runtime silently discards the write \
because the account meta says read-only. `#[account(mut)]` is what makes \
anchor mark the account as writable when assembling the instruction.
"""

[[exercises]]
name    = "ex13_signer_constraint"
chapter = "04_constraints"
mode    = "test"
hint    = """
The test deliberately builds an instruction where `owner`'s account meta \
has `is_signer = false`, then asserts the tx is rejected. Without an \
`#[account(signer)]` constraint anchor doesn't verify signing, so the call \
goes through and the assertion fails.
"""

[[exercises]]
name    = "ex14_has_one_constraint"
chapter = "04_constraints"
mode    = "check"
hint    = """
`has_one = owner` is wired up at macro-expansion time: anchor generates a \
runtime check that reads `vault.owner` and compares it to \
`accounts.owner.key()`. For that to compile, the `Vault` data struct needs \
an `owner: Pubkey` field. Add it.
"""

[[exercises]]
name    = "ex15_account_type"
chapter = "05_account_types"
mode    = "check"
hint    = """
`AccountInfo<'info>` is the raw, anchor-agnostic wrapper — it doesn't know \
the account holds a typed `Counter`. `Account<'info, T>` is the typed \
sibling: anchor checks the discriminator your `#[account]` macro emitted, \
deserialises the body into `T`, and lets you read fields directly. Change \
the field type.
"""

[[exercises]]
name    = "ex16_system_account_type"
chapter = "05_account_types"
mode    = "test"
hint    = """
The test passes in an account whose owner is a random pubkey (not the \
System Program). `AccountInfo` accepts it — it doesn't check the owner. \
`SystemAccount<'info>` checks at runtime that the owner is the System \
Program. Switch the field type.
"""

[[exercises]]
name    = "ex17_program_type"
chapter = "05_account_types"
mode    = "test"
hint    = """
The test passes a freshly-generated pubkey where the System Program is \
expected. `Program<'info, T>` enforces at runtime that the account's key \
equals `T::id()`. Anchor's `prelude` re-exports `System`, so the right \
field type is `Program<'info, System>`.
"""

[[exercises]]
name    = "ex18_account_attr"
chapter = "06_state"
mode    = "check"
hint    = """
The compiler complains that `Profile` doesn't implement `AccountSerialize`, \
`AccountDeserialize`, etc. The `#[account]` attribute is what generates \
those impls — and the discriminator, and the `Owner` impl pointing at the \
current program. Add `#[account]` above the struct.
"""

[[exercises]]
name    = "ex19_multi_field_state"
chapter = "06_state"
mode    = "test"
hint    = """
The test pre-bakes a profile with age=30 and balance=100, calls `birthday`, \
and expects age=31 with balance unchanged. Mutate `ctx.accounts.profile.age` \
in place — anchor reads the whole struct out of the account at entry and \
writes it back at exit, so the untouched `balance` field stays intact.
"""

[[exercises]]
name    = "ex20_init_payer"
chapter = "07_init_and_space"
mode    = "check"
hint    = """
The macro is telling you 'payer must be provided when initializing an \
account'. `init` allocates space on-chain, and someone has to pay the rent \
that anchors that space. Name the signer that should be charged:

    #[account(init, payer = payer, space = 8 + 8)]
"""

[[exercises]]
name    = "ex21_init_space_derive"
chapter = "07_init_and_space"
mode    = "check"
hint    = """
The compiler can't find an `INIT_SPACE` on `Profile` because anchor only \
generates it when you opt in via `#[derive(InitSpace)]`. Add that derive \
alongside `#[account]` — it computes the byte total from the field types \
so you don't have to.
"""

[[exercises]]
name    = "ex22_error_code"
chapter = "08_errors"
mode    = "check"
hint    = """
`require!` uses an error variant from an `#[error_code]` enum. Anchor \
turns each variant into a `From<MyError> for anchor_lang::error::Error` \
impl plus a stable numeric code. Define the enum so the `require!` line \
resolves.
"""

[[exercises]]
name    = "ex23_require_macro"
chapter = "08_errors"
mode    = "test"
hint    = """
The test calls `min_age(10)` and expects the transaction to fail. Anchor \
won't reject it for you — you have to actually check the argument. \
`require!(age >= 18, MyError::TooYoung);` is the shortest form: when the \
condition is false, anchor returns the error and aborts the tx.
"""

[[exercises]]
name    = "ex24_seeds_and_bump"
chapter = "09_pdas"
mode    = "check"
hint    = """
Anchor's error 'bump must be provided with seeds' is asking you to \
finish the constraint. `seeds` alone tells anchor how to derive the PDA, \
but it also has to know which bump to combine them with. Add `bump` \
after the seeds list — with no value, anchor finds and uses the \
canonical bump for you.
"""

[[exercises]]
name    = "ex25_find_program_address"
chapter = "09_pdas"
mode    = "test"
hint    = """
The test derives the expected PDA with seeds `[b"vault", user.key()]` \
and pre-bakes the vault there. The program's `seeds` constraint must \
match exactly — drop `user.key().as_ref()` into the seeds so each user \
gets their own PDA. The `as_ref()` turns the `Pubkey` into the `&[u8]` \
the seeds slice wants.
"""

[[exercises]]
name    = "ex26_bumps_field"
chapter = "10_pda_signing"
mode    = "check"
hint    = """
`ctx.bumps` is a struct anchor generates with one named field per PDA \
account in your Accounts struct. You can't assign the whole struct to a \
`u8` — pull the specific bump out: `ctx.bumps.vault`. This is the bump \
you pair with your seeds when building `signer_seeds` for `invoke_signed`.
"""

[[exercises]]
name    = "ex27_system_transfer_cpi"
chapter = "11_cpis"
mode    = "test"
hint    = """
The test sets up `payer -> receiver` and expects the receiver to be \
credited via the CPI. Build a `system_program::Transfer` accounts struct \
(both `from` and `to` are `to_account_info()` of the signer/receiver), \
wrap it in a `CpiContext::new(...)`, and call `system_program::transfer`.
"""

[[exercises]]
name    = "ex28_emit"
chapter = "12_events"
mode    = "check"
hint    = """
The compiler says `Greeted: Event` is not satisfied — `emit!` needs an \
`Event` impl plus a discriminator and borsh derives, all of which the \
`#[event]` attribute generates in one shot. Add it above the struct.
"""
